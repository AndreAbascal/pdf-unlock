[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-unlock-cli"
version = "1.0.0"
description = "Unlock encrypted PDFs locally and safely replace the originals"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "pdf-unlock contributors"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Topic :: Utilities"]
dependencies = ["pikepdf>=8", "rich>=13"]

[project.scripts]
pdf-unlock = "pdf_unlock.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "build>=1", "twine>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_unlock"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
